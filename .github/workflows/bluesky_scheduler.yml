name: Seo-yeon Autonomous Social Agent (Bluesky)

on:
  schedule:
    # Runs every 30 mins during KST waking hours: 07:00 KST to 01:30 KST (22:00 UTC - 16:30 UTC)
    - cron: '*/30 22,23 * * *'
    - cron: '*/30 0-16 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run simulation (evaluates context without publishing to Bluesky)'
        required: false
        type: boolean
        default: false
      force_action:
        description: 'Force specific ActionType (e.g. PUBLISH_TEXT_POST, PUBLISH_IMAGE_POST, NO_ACTION)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

# Prevent overlapping runner executions
concurrency:
  group: seoyeon-agent-runner
  cancel-in-progress: false

jobs:
  autonomous_tick:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Autonomous Agent Cognitive Tick
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          KIE_API_KEY: ${{ secrets.KIE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          INPUT_FORCE_ACTION: ${{ github.event.inputs.force_action }}

        run: |
          FLAGS="--auto"
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            FLAGS="--dry-run"
          fi
          if [ -n "$INPUT_FORCE_ACTION" ]; then
            FLAGS="$FLAGS --force-action $INPUT_FORCE_ACTION"
          fi

          python agent_runner.py $FLAGS

      - name: Commit updated memory, logs, and audit ledger
        if: ${{ !cancelled() && github.event.inputs.dry_run != 'true' }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          for f in data/memory/identity_memory.json \
                   data/memory/user_memory.json \
                   data/memory/opinions_memory.json \
                   data/memory/episodic_memory.jsonl \
                   data/memory/recent_context.json \
                   data/memory/agent_state.json \
                   data/memory/weekly_schedule.json \
                   data/memory/active_goals.json \
                   data/memory/narrative_state.json \
                   data/vault.enc \
                   data/logs/tick_history.jsonl \
                   data/budget_ledger.json \
                   data/weather_cache.json; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done
          git diff --staged --quiet || {
            git commit -m "chore(agent): persist autonomous memory and audit ledger [skip ci]"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push origin main && break || sleep 2
            done
          }
