name: Cross-Platform Campaign Scheduler (Fanvue + Bluesky)

on:
  schedule:
    # 23:30 UTC = 08:30 KST (Morning wake-up drop)
    - cron: '30 23 * * *'
    # 11:30 UTC = 20:30 KST (Evening high-engagement drop)
    - cron: '30 11 * * *'
  workflow_dispatch:
    inputs:
      drop_id:
        description: 'Specific Drop ID to dispatch (e.g. tue_cozy_knit, fri_morning_window). Leave blank for auto day detection.'
        required: false
        type: string
      dry_run:
        description: 'Dry run simulation (validates Fanvue existence & Bluesky assets without publishing)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  dispatch_campaign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Synchronized Campaign Dispatch
        # Fanvue sets are pre-scheduled natively on Fanvue servers with publishAt.
        # GitHub Actions only needs Bluesky credentials to trigger the matching teaser.
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: |
          EXTRA_FLAGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            EXTRA_FLAGS="--dry-run"
          fi

          if [ -n "${{ github.event.inputs.drop_id }}" ]; then
            python growth/campaign_orchestrator.py --dispatch "${{ github.event.inputs.drop_id }}" $EXTRA_FLAGS
          else
            python growth/campaign_orchestrator.py --auto $EXTRA_FLAGS
          fi

      - name: Commit updated schedule and ledger
        if: success() && github.event.inputs.dry_run != 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add growth/schedule_assets/weekly_schedule.json growth/ledger.jsonl
          git diff --staged --quiet || (git commit -m "chore(scheduler): update live post status and audit ledger [skip ci]" && git push origin main)
