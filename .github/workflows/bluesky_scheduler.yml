name: Cross-Platform Campaign Scheduler (Fanvue + Bluesky)

on:
  schedule:
    # Runs every 30 mins during KST waking hours: 07:00 KST to 01:30 KST (22:00 UTC - 16:30 UTC)
    - cron: '*/30 22,23 * * *'
    - cron: '*/30 0-16 * * *'
  workflow_dispatch:
    inputs:
      drop_id:
        description: 'Specific Drop ID to dispatch (e.g. tue_cozy_knit, fri_morning_window). Leave blank for auto day detection.'
        required: false
        type: string
      dry_run:
        description: 'Dry run simulation (validates Fanvue existence & Bluesky assets without publishing)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# Prevent overlapping scheduler runs
concurrency:
  group: bluesky-scheduler
  cancel-in-progress: false

jobs:
  dispatch_campaign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Synchronized Campaign Dispatch
        # Fanvue sets are pre-scheduled natively on Fanvue servers with publishAt.
        # GitHub Actions only needs Bluesky credentials to trigger the matching teaser.
        continue-on-error: true
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: |
          EXTRA_FLAGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            EXTRA_FLAGS="--dry-run"
          fi

          if [ -n "${{ github.event.inputs.drop_id }}" ]; then
            python growth/campaign_orchestrator.py --dispatch "${{ github.event.inputs.drop_id }}" $EXTRA_FLAGS
          else
            python growth/campaign_orchestrator.py --auto $EXTRA_FLAGS
          fi

      - name: Execute Organic Voice Dispatch (Lyra Thoughts)
        if: ${{ !cancelled() && github.event.inputs.dry_run != 'true' }}
        continue-on-error: true
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: |
          python growth/bsky_text_post.py --auto

      - name: Execute Organic Engagement (Lyra Comments)
        if: ${{ !cancelled() && github.event.inputs.dry_run != 'true' }}
        continue-on-error: true
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BSKY_ENGAGE_MAX_COMMENTS: "5"
        run: |
          python growth/bsky_engage.py --auto

      - name: Execute Inbound Two-Way Engagement (Lyra Replies)
        if: ${{ !cancelled() && github.event.inputs.dry_run != 'true' }}
        continue-on-error: true
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python growth/bsky_reply_worker.py --auto

      - name: Execute Audience Harvester & Follower Growth (Lyra Sourcing)
        if: ${{ !cancelled() && github.event.inputs.dry_run != 'true' }}
        continue-on-error: true
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: |
          python growth/bsky_growth_engine.py --auto

      - name: Execute Fanvue Subscriber Retention & Chat Agent (Apex Sanctuary)
        if: ${{ !cancelled() && github.event.inputs.dry_run != 'true' }}
        continue-on-error: true
        env:
          FANVUE_API_KEY: ${{ secrets.FANVUE_API_KEY }}
          FANVUE_TOKENS_JSON: ${{ secrets.FANVUE_TOKENS_JSON }}
          OAUTH_CLIENT_ID: ${{ secrets.FANVUE_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.FANVUE_CLIENT_SECRET }}
          OAUTH_SCOPES: "read:self read:chat write:chat read:fan read:creator read:media write:media read:post write:post read:insights read:tracking_links write:tracking_links offline_access"
          OAUTH_REDIRECT_URI: "https://protoxiderpg.it/api/oauth/callback"
          OAUTH_ISSUER_BASE_URL: "https://auth.fanvue.com"
          API_BASE_URL: "https://api.fanvue.com"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python growth/fanvue_chat_agent.py --auto

      - name: Commit updated schedule and ledger
        if: ${{ !cancelled() && github.event.inputs.dry_run != 'true' }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add growth/schedule_assets/weekly_schedule.json growth/ledger.jsonl growth/bsky_organic_posts.jsonl growth/bsky_comments.jsonl growth/bsky_growth_follows.jsonl growth/bsky_replied_notifications.jsonl growth/welcomed.json growth/fanvue_chat_history.jsonl .pi/agent-memory/lyra/MEMORY.md
          git diff --staged --quiet || (git commit -m "chore(scheduler): update live post status and audit ledger [skip ci]" && git pull --rebase --autostash origin main && git push origin main)
