name: Seo-yeon Autonomous Social Agent (Bluesky)

on:
  # Periodic dispatch comes from cron-job.org; see docs/OPERATIONS.md.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run simulation (evaluates context without publishing to Bluesky)'
        required: false
        type: boolean
        default: false
      force_action:
        description: 'Force specific ActionType (e.g. PUBLISH_TEXT_POST, PUBLISH_IMAGE_POST, NO_ACTION)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

# Prevent overlapping runner executions
concurrency:
  group: seoyeon-agent-runner
  cancel-in-progress: false

jobs:
  autonomous_tick:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure durable state commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Runtime state lives only in the encrypted bundle on the single-commit `state` branch.
      # Bootstrap (one time): if that branch does not exist yet, take data/ from the last main
      # commit that still carried state; the first checkpoint then creates the branch.
      - name: Restore encrypted state
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p data
          set +e
          git ls-remote --exit-code origin refs/heads/state > /dev/null
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            git fetch --quiet --depth=1 origin refs/heads/state:refs/remotes/origin/state
            git show origin/state:vault.enc > data/vault.enc
            git rev-parse origin/state > data/.state_base
          elif [ "$status" -eq 2 ]; then
            git fetch --quiet --depth=200 origin main
            # --first-parent: through the cutover merge, plain path history would follow the feature
            # branch and find a stale vault instead of the latest state committed on main.
            legacy=$(git log -1 --first-parent --diff-filter=AM --format=%H FETCH_HEAD -- data/vault.enc)
            if [ -z "$legacy" ]; then echo "No state branch and no legacy state found"; exit 1; fi
            git checkout "$legacy" -- data
            git reset --quiet
            git checkout HEAD -- data/memory/identity_memory.json
            : > data/.state_base
            echo "Bootstrapped state from legacy main commit"
          else
            echo "Could not read the state branch"; exit 1
          fi

      - name: Execute Autonomous Agent Cognitive Tick
        if: github.ref == 'refs/heads/main'
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          KIE_API_KEY: ${{ secrets.KIE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Required. No fallback derived from account credentials.
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}
          ENV: production
          SEOYEON_GIT_CHECKPOINT: "1"
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          INPUT_FORCE_ACTION: ${{ github.event.inputs.force_action }}

        run: |
          if [ -z "$DATA_ENCRYPTION_KEY" ]; then
            echo "DATA_ENCRYPTION_KEY secret is required"; exit 1
          fi
          FLAGS="--auto"
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            FLAGS="--dry-run"
          fi
          if [ -n "$INPUT_FORCE_ACTION" ]; then
            FLAGS="$FLAGS --force-action $INPUT_FORCE_ACTION"
          fi

          python agent_runner.py $FLAGS

      - name: Publish final encrypted state
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event.inputs.dry_run != 'true' }}
        run: python -m agent.git_checkpoint

      # Encrypted recovery copies; the state branch itself keeps only the latest commit.
      - name: Keep recovery copy of encrypted state
        if: ${{ always() && github.ref == 'refs/heads/main' && github.event.inputs.dry_run != 'true' && hashFiles('data/vault.enc') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: state-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/vault.enc
          retention-days: 7
          if-no-files-found: ignore
