name: CI Test Suite

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Hermetic Test Suite
        env:
          ENV: test
          BSKY_HANDLE: syeonhn.bsky.social
          BSKY_APP_PASSWORD: test_ci_mock_app_password
          DATA_ENCRYPTION_KEY: test_ci_encryption_key_mock_only
          OPENROUTER_API_KEY: test_ci_mock_openrouter_key
        run: |
          python -m unittest discover -s tests -p "test_*.py"
